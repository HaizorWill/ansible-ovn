---
name: Ansible matrix test
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["dev/**"]


jobs:
  ansible-matrix:
    strategy:
      matrix:
        core: ["2.16", "2.19"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ansible-galaxy
        run: pip install ansible-galaxy

      - name: Install ansible core
        run: pip install ansible-core==${{ matrix.core }}.*
      
      - name: Install ansible dependencies
        run: ansible-galaxy install -r requirements.yml

      - name: Run test playbook
        run: ansible-playbook tests/test.yml -i tests/inventory.yml -v --diff
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/..
