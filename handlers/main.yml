---
- name: "Systemd daemon-reload"
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: "Enable ovn-central service"
  become: true
  ansible.builtin.systemd_service:
    name: "ovn-central"
    enabled: true
    state: "restarted"

- name: "Enable ovn-host service"
  become: true
  ansible.builtin.systemd_service:
    name: "ovn-host"
    enabled: true
    state: "restarted"
